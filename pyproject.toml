[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsreval"
version = "0.1.0"
description = "Evaluation bench for video super-resolution: image metrics (via pyiqa) and the video metrics DOVER, FasterVQA and E*warp."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  # torch, torchvision (tensor ops), opencv and imageio-ffmpeg (decoding, and the ffmpeg that writes the canonical files) are kept in the
  # series the scores were produced with, because the metric values depend on them; pyiqa (metric definitions) is open from the tested version
  "torch>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
  "pyiqa>=0.1.16",
  "opencv-python-headless>=4.11,<4.12",
  "imageio-ffmpeg>=0.6,<0.7",
  "numpy>=1.26,<2",                 # decord's wheels are built against the numpy 1.x ABI
  "decord",
  "timm>=0.9",
  "einops",
  "tqdm",
  "imageio",
  "setuptools<82",                  # the `clip` module pyiqa needs does `from pkg_resources import packaging`; setuptools 82 removed pkg_resources
]

[project.scripts]
vsreval = "vsreval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vsreval"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
